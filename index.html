<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiniGame 2.0</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#dff6ff,#f4e1ff);
    color:#222;
    text-align:center;
}

.container{
    width:min(900px,94%);
    margin:auto;
}

.panel{
    background:#ffffffee;
    padding:25px;
    margin:20px 0;
    border-radius:22px;
    box-shadow:0 8px 25px #0002;
}

button{
    border:0;
    padding:12px 18px;
    border-radius:12px;
    cursor:pointer;
    font-weight:bold;
    margin:5px;
}

.btn{
    background:#675cff;
    color:white;
}

input{
    padding:12px;
    border:2px solid #ddd;
    border-radius:10px;
    margin:5px;
}

.hidden{
    display:none;
}

.game{
    background:white;
    padding:20px;
    border-radius:18px;
    margin:15px 0;
}

#snakeCanvas{
    border:4px solid #222;
    background:#eee;
    max-width:100%;
}
</style>
</head>

<body>

<!-- GİRİŞ -->

<div id="login" class="panel container">

    <h1>🎮 MiniGame 2.0</h1>

    <input id="name" placeholder="Oyuncu adı">

    <input
        id="password"
        type="password"
        placeholder="Şifre">

    <button class="btn" onclick="login()">
        🎮 Oyuna Gir
    </button>

    <p id="loginMsg"></p>

</div>


<!-- ANA SAYFA -->

<div id="main" class="hidden">

<div class="container">

    <div class="panel">

        <h1>🎮 MiniGame 2.0</h1>

        <h2>
            👤 <span id="playerName"></span>
        </h2>

        <h2>
            💰 <span id="coins">0</span> puan
        </h2>

        <button onclick="logout()">
            🚪 Çıkış
        </button>

    </div>


    <!-- OYUNLAR -->

    <div class="panel">

        <h2>🎮 Oyunlar</h2>

        <div class="game">

            <h3>🐍 Yılan</h3>

            <canvas
                id="snakeCanvas"
                width="400"
                height="400">
            </canvas>

            <br>

            <button
                class="btn"
                onclick="startSnake()">
                🐍 Başlat
            </button>

            <p>
                Puan:
                <b id="snakeScore">0</b>
            </p>

        </div>

    </div>


    <!-- REKORLAR -->

    <div class="panel">

        <h2>🏆 Rekorlar</h2>

        <p>
            🐍 Yılan Rekoru:
            <b id="snakeBest">0</b>
        </p>

        <p>
            ⭐ Toplam Rekor:
            <b id="bestScore">0</b>
        </p>

    </div>

</div>

</div>


<script>

/* =====================================================
   HESAP
===================================================== */

let account = {
    name:"",
    password:"",
    coins:0
};


/* =====================================================
   YILAN
===================================================== */

let snake = [];
let food = {};

let direction = "right";
let nextDirection = "right";

let snakeScore = 0;

let snakeTimer = null;
let snakeRunning = false;


/* =====================================================
   HESABI KAYDET
===================================================== */

function saveAccount(){

    localStorage.setItem(
        "miniGameAccount",
        JSON.stringify(account)
    );

}


/* =====================================================
   GİRİŞ
===================================================== */

function login(){

    const name =
        document
        .getElementById("name")
        .value
        .trim();

    const password =
        document
        .getElementById("password")
        .value;

    const saved =
        localStorage.getItem(
            "miniGameAccount"
        );


    /* İLK HESAP */

    if(!saved){

        if(name.length < 2){

            document
            .getElementById("loginMsg")
            .textContent =
                "❌ İsim en az 2 karakter olmalı.";

            return;
        }


        if(password.length < 4){

            document
            .getElementById("loginMsg")
            .textContent =
                "❌ Şifre en az 4 karakter olmalı.";

            return;
        }


        account = {

            name:name,
            password:password,
            coins:0

        };


        saveAccount();

        enterGame();

        return;
    }


    /* MEVCUT HESAP */

    account =
        JSON.parse(saved);


    if(name !== account.name){

        document
        .getElementById("loginMsg")
        .textContent =
            "❌ İsim yanlış.";

        return;
    }


    if(password !== account.password){

        document
        .getElementById("loginMsg")
        .textContent =
            "❌ Şifre yanlış.";

        return;
    }


    enterGame();

}


/* =====================================================
   OYUNA GİR
===================================================== */

function enterGame(){

    document
        .getElementById("login")
        .classList.add("hidden");

    document
        .getElementById("main")
        .classList.remove("hidden");

    updatePage();

}


/* =====================================================
   ÇIKIŞ
===================================================== */

function logout(){

    stopSnake();

    document
        .getElementById("main")
        .classList.add("hidden");

    document
        .getElementById("login")
        .classList.remove("hidden");

}


/* =====================================================
   SAYFAYI GÜNCELLE
===================================================== */

function updatePage(){

    document
        .getElementById("playerName")
        .textContent =
        account.name;


    document
        .getElementById("coins")
        .textContent =
        account.coins;


    document
        .getElementById("snakeBest")
        .textContent =
        localStorage.getItem(
            "snakeBest"
        ) || 0;


    document
        .getElementById("bestScore")
        .textContent =
        localStorage.getItem(
            "bestScore"
        ) || 0;

}


/* =====================================================
   PUAN EKLE
===================================================== */

function addCoins(amount){

    account.coins += amount;

    saveAccount();

    updatePage();

}


/* =====================================================
   YILAN BAŞLAT
===================================================== */

function startSnake(){

    stopSnake();


    snake = [

        {
            x:200,
            y:200
        },

        {
            x:180,
            y:200
        },

        {
            x:160,
            y:200
        }

    ];


    direction = "right";
    nextDirection = "right";

    snakeScore = 0;
    snakeRunning = true;


    document
        .getElementById("snakeScore")
        .textContent = "0";


    createFood();

    drawSnake();


    snakeTimer =
        setInterval(
            snakeLoop,
            160
        );

}


/* =====================================================
   YILAN DURDUR
===================================================== */

function stopSnake(){

    if(snakeTimer){

        clearInterval(
            snakeTimer
        );

        snakeTimer = null;

    }

    snakeRunning = false;

}


/* =====================================================
   YEMEK OLUŞTUR
===================================================== */

function createFood(){

    food = {

        x:
            Math.floor(
                Math.random()*20
            )*20,

        y:
            Math.floor(
                Math.random()*20
            )*20

    };


    if(
        snake.some(
            part =>
                part.x === food.x &&
                part.y === food.y
        )
    ){

        createFood();

    }

}


/* =====================================================
   YILAN DÖNGÜSÜ
===================================================== */

function snakeLoop(){

    direction =
        nextDirection;


    const head = {

        x:snake[0].x,
        y:snake[0].y

    };


    if(direction === "up")
        head.y -= 20;

    if(direction === "down")
        head.y += 20;

    if(direction === "left")
        head.x -= 20;

    if(direction === "right")
        head.x += 20;


    /* DUVAR */

    if(
        head.x < 0 ||
        head.x >= 400 ||
        head.y < 0 ||
        head.y >= 400
    ){

        finishSnake();

        return;

    }


    /* KENDİNE ÇARPMA */

    if(
        snake.some(
            part =>
                part.x === head.x &&
                part.y === head.y
        )
    ){

        finishSnake();

        return;

    }


    snake.unshift(head);


    /* YEMEK */

    if(
        head.x === food.x &&
        head.y === food.y
    ){

        snakeScore++;


        document
            .getElementById("snakeScore")
            .textContent =
            snakeScore;


        createFood();

    }
    else{

        snake.pop();

    }


    drawSnake();

}


/* =====================================================
   YILANI ÇİZ
===================================================== */

function drawSnake(){

    const canvas =
        document.getElementById(
            "snakeCanvas"
        );

    const ctx =
        canvas.getContext("2d");


    ctx.clearRect(
        0,
        0,
        400,
        400
    );


    /* YILAN */

    ctx.fillStyle =
        "#2ed573";


    snake.forEach(
        part => {

            ctx.fillRect(
                part.x+1,
                part.y+1,
                18,
                18
            );

        }
    );


    /* YEMEK */

    ctx.fillStyle =
        "#ff4757";


    ctx.beginPath();

    ctx.arc(
        food.x+10,
        food.y+10,
        8,
        0,
        Math.PI*2
    );

    ctx.fill();

}


/* =====================================================
   OYUN BİTTİ
===================================================== */

function finishSnake(){

    stopSnake();


    const reward =
        snakeScore * 80;


    /* PUAN VER */

    addCoins(
        reward
    );


    /* YILAN REKORU */

    const oldBest =
        Number(
            localStorage.getItem(
                "snakeBest"
            ) || 0
        );


    if(snakeScore > oldBest){

        localStorage.setItem(
            "snakeBest",
            snakeScore
        );

    }


    /* TOPLAM REKOR */

    const total =
        Number(
            localStorage.getItem(
                "bestScore"
            ) || 0
        );


    if(account.coins > total){

        localStorage.setItem(
            "bestScore",
            account.coins
        );

    }


    updatePage();


    alert(
        "🐍 Oyun bitti!\n\n" +
        snakeScore +
        " elma topladın!\n" +
        "+" +
        reward +
        " puan!"
    );

}


/* =====================================================
   KLAVYE
===================================================== */

document.addEventListener(
    "keydown",
    function(event){

        const keys = {

            ArrowUp:"up",
            ArrowDown:"down",
            ArrowLeft:"left",
            ArrowRight:"right",

            w:"up",
            W:"up",
            s:"down",
            S:"down",
            a:"left",
            A:"left",
            d:"right",
            D:"right"

        };


        const newDirection =
            keys[event.key];


        if(!newDirection)
            return;


        const opposite = {

            up:"down",
            down:"up",
            left:"right",
            right:"left"

        };


        if(
            opposite[newDirection] !==
            direction
        ){

            nextDirection =
                newDirection;

        }

    }
);

</script>
