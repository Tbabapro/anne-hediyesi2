<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mini Oyun Merkezi</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#dff6ff,#f4e1ff);
color:#222;
}

.container{
width:min(1000px,94%);
margin:auto;
}

.panel{
background:#ffffffee;
padding:20px;
border-radius:20px;
margin:20px 0;
box-shadow:0 8px 25px #0002;
}

button{
border:0;
padding:12px 18px;
border-radius:12px;
cursor:pointer;
font-weight:bold;
background:#675cff;
color:white;
}

input{
padding:12px;
border:2px solid #ddd;
border-radius:10px;
margin:5px;
}

/* GİRİŞ */

#login{
position:fixed;
inset:0;
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(135deg,#dff6ff,#f4e1ff);
z-index:10;
}

.loginBox{
background:white;
padding:30px;
border-radius:22px;
text-align:center;
width:min(400px,90%);
}

/* AVATAR */

.avatar{
width:200px;
height:300px;
margin:auto;
position:relative;
}

.head{
position:absolute;
top:10px;
left:65px;
width:70px;
height:70px;
border-radius:50%;
background:#ffd1a9;
display:flex;
align-items:center;
justify-content:center;
font-size:35px;
z-index:3;
}

.body{
position:absolute;
top:75px;
left:60px;
width:80px;
height:110px;
background:#5c6cff;
border-radius:25px;
}

.arm{
position:absolute;
top:85px;
width:25px;
height:90px;
background:#ffd1a9;
border-radius:20px;
}

.arm.left{
left:35px;
}

.arm.right{
right:35px;
}

.leg{
position:absolute;
top:180px;
width:30px;
height:100px;
background:#333;
border-radius:0 0 15px 15px;
}

.leg.left{
left:62px;
}

.leg.right{
right:62px;
}

.wear{
position:absolute;
z-index:5;
}

.hat{
top:-15px;
left:65px;
font-size:45px;
}

.glasses{
top:35px;
left:82px;
font-size:28px;
}

.shirt{
top:95px;
left:75px;
font-size:50px;
}

.pants{
top:170px;
left:75px;
font-size:40px;
}

.shoes{
top:250px;
left:65px;
font-size:40px;
}

/* OYUNLAR */

.games{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
}

.gameCard{
background:white;
padding:20px;
border-radius:18px;
text-align:center;
}

.big{
font-size:50px;
}

.hidden{
display:none!important;
}

@media(max-width:600px){

.games{
grid-template-columns:1fr;
}

}

</style>
</head>

<body>

<!-- GİRİŞ -->

<div id="login">

<div class="loginBox">

<h1>🎮 Mini Oyun Merkezi</h1>

<div id="register">

<h2>Yeni Hesap</h2>

<input
id="newName"
placeholder="Oyuncu adı"
maxlength="20"
>

<br>

<input
id="newPassword"
type="password"
placeholder="Şifre"
>

<br><br>

<button onclick="createAccount()">
Hesap Oluştur
</button>

</div>

<div id="enter" class="hidden">

<h2>🔐 Giriş</h2>

<p id="hello"></p>

<input
id="password"
type="password"
placeholder="Şifre"
>

<br><br>

<button onclick="login()">
Giriş Yap
</button>

</div>

</div>

</div>


<header style="text-align:center;padding:25px">

<h1>🎮 Mini Oyun Merkezi</h1>

<p>Oyna • Puan kazan • Avatarını giydir</p>

</header>


<main class="container">

<!-- PROFİL -->

<section class="panel">

<h2>👤 Avatarın</h2>

<div class="avatar">

<div class="head">🙂</div>

<div class="body"></div>

<div class="arm left"></div>
<div class="arm right"></div>

<div class="leg left"></div>
<div class="leg right"></div>

<div id="hat" class="wear hat"></div>
<div id="glasses" class="wear glasses"></div>
<div id="shirt" class="wear shirt"></div>
<div id="pants" class="wear pants"></div>
<div id="shoes" class="wear shoes"></div>

</div>

<h2 style="text-align:center" id="player">
Oyuncu
</h2>

<p style="text-align:center">
💰 Puan: <b id="coins">0</b>
</p>

</section>


<!-- OYUNLAR -->

<section class="panel">

<h2>🎮 Oyunlar</h2>

<div class="games">

<div class="gameCard">

<div class="big">🧠</div>

<h2>Hafıza</h2>

<p>Kartları eşleştir.</p>

<button>
Oyna
</button>

</div>


<div class="gameCard">

<div class="big">🐍</div>

<h2>Mini Yılan</h2>

<p>Yemleri topla.</p>

<button>
Oyna
</button>

</div>


<div class="gameCard">

<div class="big">⚡</div>

<h2>Hızlı Tıkla</h2>

<p>Hızlı tıkla!</p>

<button>
Oyna
</button>

</div>


<div class="gameCard">

<div class="big">🎯</div>

<h2>Hedef</h2>

<p>Hedefleri yakala.</p>

<button>
Oyna
</button>

</div>

</div>

</section>

</main>

 
<script>

/* =========================
   HESAP / ŞİFRE
========================= */

const KEY = "miniOyunHesap";

let data = {
    name:"",
    password:"",
    coins:0,
    records:[],
    owned:[],
    equipped:{
        hat:"",
        glasses:"",
        shirt:"",
        pants:"",
        shoes:""
    }
};

let saved = localStorage.getItem(KEY);

if(saved){
    data = JSON.parse(saved);

    document.getElementById("register")
        .classList.add("hidden");

    document.getElementById("enter")
        .classList.remove("hidden");

    document.getElementById("hello")
        .textContent =
        "Hoş geldin, " + data.name + "!";
}


function save(){
    localStorage.setItem(
        KEY,
        JSON.stringify(data)
    );
}


function createAccount(){

    const name =
        document.getElementById("newName")
        .value.trim();

    const password =
        document.getElementById("newPassword")
        .value;

    if(name.length < 2){
        alert("İsmini biraz daha uzun yaz.");
        return;
    }

    if(password.length < 4){
        alert("Şifre en az 4 karakter olsun.");
        return;
    }

    data.name = name;
    data.password = password;

    save();

    document.getElementById("register")
        .classList.add("hidden");

    document.getElementById("enter")
        .classList.remove("hidden");

    document.getElementById("hello")
        .textContent =
        "Hoş geldin, " + name + "!";
}


function login(){

    const password =
        document.getElementById("password")
        .value;

    if(password !== data.password){
        alert("❌ Şifre yanlış!");
        return;
    }

    document.getElementById("login")
        .classList.add("hidden");

    updateUI();

    startMemory();
}


/* =========================
   MARKET
========================= */

const items = [

    ["hat1","hat","🎩","Şapka",50],
    ["hat2","hat","👑","Taç",150],
    ["hat3","hat","🧢","Kep",250],

    ["glasses1","glasses","😎","Güneş Gözlüğü",75],
    ["glasses2","glasses","🤓","Gözlük",125],

    ["shirt1","shirt","👕","Tişört",100],
    ["shirt2","shirt","👔","Gömlek",200],
    ["shirt3","shirt","🧥","Mont",350],

    ["pants1","pants","👖","Pantolon",150],
    ["pants2","pants","🩳","Şort",100],

    ["shoes1","shoes","👟","Spor Ayakkabı",200],
    ["shoes2","shoes","🥾","Bot",300]
];


function getItemIcon(type){

    const id = data.equipped[type];

    const item =
        items.find(x => x[0] === id);

    return item ? item[2] : "";
}


function updateUI(){

    document.getElementById("player")
        .textContent =
        "👤 " + data.name;

    document.getElementById("coins")
        .textContent =
        data.coins;

    document.getElementById("hat")
        .textContent =
        getItemIcon("hat");

    document.getElementById("glasses")
        .textContent =
        getItemIcon("glasses");

    document.getElementById("shirt")
        .textContent =
        getItemIcon("shirt");

    document.getElementById("pants")
        .textContent =
        getItemIcon("pants");

    document.getElementById("shoes")
        .textContent =
        getItemIcon("shoes");
}


/* =========================
   HAFIZA OYUNU
========================= */

const memorySymbols = [

    "🍎","🍎",
    "🚀","🚀",
    "🐱","🐱",
    "⚽","⚽",
    "🎮","🎮",
    "🍕","🍕",
    "⭐","⭐",
    "🔥","🔥"

];

let memoryFirst = null;
let memorySecond = null;
let memoryLock = false;
let memoryMoves = 0;
let memoryMatched = 0;


function startMemory(){

    const old =
        document.getElementById("memoryBoard");

    if(old){
        old.remove();
    }

    const title =
        document.querySelector(
            ".gameCard"
        );

    /*
      Hafıza tahtasını oluşturuyoruz.
    */

    const board =
        document.createElement("div");

    board.id = "memoryBoard";

    board.style.display = "grid";
    board.style.gridTemplateColumns =
        "repeat(4,1fr)";
    board.style.gap = "10px";
    board.style.maxWidth = "500px";
    board.style.margin = "20px auto";

    const area =
        document.querySelector(
            ".games"
        );

    /*
      Hafıza oyunu henüz menüde açılmadığı
      için tahtayı gizli tutuyoruz.
    */

    board.style.display = "none";

    document.body.appendChild(board);

    memoryFirst = null;
    memorySecond = null;
    memoryLock = false;
    memoryMoves = 0;
    memoryMatched = 0;
}


function createMemoryGame(){

    let board =
        document.getElementById(
            "memoryBoard"
        );

    if(!board){
        startMemory();
        board =
            document.getElementById(
                "memoryBoard"
            );
    }

    board.innerHTML = "";
    board.style.display = "grid";

    const shuffled =
        [...memorySymbols].sort(
            () => Math.random() - 0.5
        );

    shuffled.forEach(symbol => {

        const card =
            document.createElement("button");

        card.style.height = "90px";
        card.style.fontSize = "32px";
        card.style.background = "#675cff";
        card.style.color = "white";
        card.style.borderRadius = "14px";

        /*
          Emoji ilk başta GÖRÜNMEZ.
        */

        card.textContent = "?";

        card.dataset.symbol = symbol;

        card.onclick = function(){

            if(memoryLock)return;

            if(card.dataset.open === "yes")
                return;

            card.dataset.open = "yes";

            card.textContent =
                card.dataset.symbol;

            if(!memoryFirst){

                memoryFirst = card;
                return;
            }

            memorySecond = card;
            memoryMoves++;

            if(
                memoryFirst.dataset.symbol ===
                memorySecond.dataset.symbol
            ){

                memoryFirst.style.background =
                    "#67c767";

                memorySecond.style.background =
                    "#67c767";

                memoryMatched += 2;

                memoryFirst = null;
                memorySecond = null;

                if(
                    memoryMatched ===
                    memorySymbols.length
                ){

                    const points =
                        Math.max(
                            20,
                            150 -
                            memoryMoves * 5
                        );

                    data.coins += points;

                    data.records.push({
                        game:"Hafıza",
                        points:points
                    });

                    data.records.sort(
                        (a,b)=>
                        b.points-a.points
                    );

                    data.records =
                        data.records.slice(0,3);

                    save();
                    updateUI();

                    setTimeout(() => {

                        alert(
                            "🎉 Tebrikler!\n\n" +
                            "Hamle: " +
                            memoryMoves +
                            "\nPuan: " +
                            points
                        );

                    },500);
                }

            }else{

                memoryLock = true;

                setTimeout(() => {

                    memoryFirst.textContent = "?";
                    memorySecond.textContent = "?";

                    memoryFirst.dataset.open = "no";
                    memorySecond.dataset.open = "no";

                    memoryFirst = null;
                    memorySecond = null;

                    memoryLock = false;

                },700);
            }

        };

        board.appendChild(card);

    });

}


/* =========================
   HAFIZA BUTONU
========================= */

const memoryButton =
    document.createElement("button");

memoryButton.textContent =
    "🧠 Hafıza Oyununu Aç";

memoryButton.style.display =
    "block";

memoryButton.style.margin =
    "20px auto";

memoryButton.onclick =
    function(){

        createMemoryGame();

        window.scrollTo({
            top:
            document.getElementById(
                "memoryBoard"
            ).offsetTop - 20,

            behavior:"smooth"
        });

    };

document.body.appendChild(
    memoryButton
);


/* =========================
   SAYFA AÇILINCA
========================= */

if(
    data.name &&
    data.password
){
    updateUI();
}

</script>
```


</body>
</html>
