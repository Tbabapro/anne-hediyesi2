```html
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Yeni Silah Oyunu</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial, sans-serif;
    background:#111;
    color:white;
}

body{
    user-select:none;
}

/* ANA MENÜ */

#menu{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(circle at center,#263238 0%,#111 65%);
    z-index:100;
}

.menuBox{
    width:min(90%,500px);
    padding:45px 30px;
    text-align:center;
    background:rgba(20,20,20,.92);
    border:2px solid #555;
    border-radius:20px;
    box-shadow:0 0 40px rgba(0,0,0,.7);
}

.menuBox h1{
    font-size:42px;
    margin-bottom:12px;
}

.menuBox p{
    color:#bbb;
    margin-bottom:30px;
}

.startBtn{
    border:0;
    border-radius:12px;
    padding:16px 45px;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
    background:#e53935;
    color:white;
    transition:.2s;
}

.startBtn:hover{
    transform:scale(1.05);
}

/* OYUN */

#game{
    display:none;
    position:fixed;
    inset:0;
    background:#172026;
    cursor:none;
}

/* ÜST BİLGİ */

#hud{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:70px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 25px;

    background:rgba(0,0,0,.7);
    z-index:20;
}

.hudItem{
    font-size:21px;
    font-weight:bold;
}

.hudItem span{
    color:#ffd54f;
}

/* OYUN ALANI */

#arena{
    position:absolute;
    inset:70px 0 0 0;
    overflow:hidden;

    background:
        linear-gradient(
            rgba(0,0,0,.15),
            rgba(0,0,0,.15)
        ),
        repeating-linear-gradient(
            0deg,
            #263238 0px,
            #263238 40px,
            #29383d 40px,
            #29383d 80px
        );
}

/* HEDEF */

.target{
    position:absolute;

    width:75px;
    height:75px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #fff 0 12%,
            #e53935 13% 30%,
            #fff 31% 48%,
            #e53935 49% 68%,
            #222 69% 100%
        );

    border:3px solid #111;

    box-shadow:
        0 4px 12px rgba(0,0,0,.6);

    cursor:none;

    animation:targetAppear .15s ease-out;
}

@keyframes targetAppear{
    from{
        transform:scale(.2);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

/* NİŞANGÂH */

#crosshair{
    position:fixed;
    width:34px;
    height:34px;

    pointer-events:none;
    z-index:50;

    transform:translate(-50%,-50%);
}

#crosshair::before,
#crosshair::after{
    content:"";
    position:absolute;
    background:#fff;
    box-shadow:0 0 4px #000;
}

#crosshair::before{
    width:34px;
    height:3px;
    left:0;
    top:15px;
}

#crosshair::after{
    width:3px;
    height:34px;
    left:15px;
    top:0;
}

.crossDot{
    position:absolute;
    width:6px;
    height:6px;
    background:#e53935;
    border-radius:50%;
    left:14px;
    top:14px;
}

/* MERMİ / ATIŞ EFEKTİ */

#flash{
    position:fixed;
    width:100px;
    height:100px;
    border-radius:50%;

    background:radial-gradient(
        circle,
        rgba(255,255,255,.9),
        rgba(255,200,0,.5),
        transparent 70%
    );

    pointer-events:none;
    opacity:0;
    transform:translate(-50%,-50%);
    z-index:40;
}

/* OYUN BİTTİ */

#gameOver{
    display:none;

    position:absolute;
    inset:0;

    background:rgba(0,0,0,.8);

    z-index:90;

    align-items:center;
    justify-content:center;
}

.gameOverBox{
    text-align:center;
    background:#171717;
    border:2px solid #555;
    border-radius:20px;
    padding:35px;
    width:min(90%,450px);
}

.gameOverBox h2{
    font-size:40px;
    margin-bottom:20px;
}

.result{
    font-size:22px;
    margin:10px 0;
}

.restartBtn{
    margin-top:25px;
    border:0;
    border-radius:10px;
    padding:14px 35px;
    background:#e53935;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.restartBtn:hover{
    transform:scale(1.05);
}

/* MOBİL */

@media(max-width:600px){

    #hud{
        height:60px;
        padding:0 12px;
    }

    .hudItem{
        font-size:15px;
    }

    #arena{
        inset:60px 0 0 0;
    }

    .target{
        width:65px;
        height:65px;
    }

    .menuBox h1{
        font-size:32px;
    }
}
</style>
</head>

<body>

<!-- ANA MENÜ -->

<div id="menu">

    <div class="menuBox">

        <h1>🎯 HEDEF OYUNU</h1>

        <p>
            Hedefleri mümkün olduğunca hızlı vur!
        </p>

        <button class="startBtn" onclick="startGame()">
            OYUNA BAŞLA
        </button>

    </div>

</div>


<!-- OYUN -->

<div id="game">

    <div id="hud">

        <div class="hudItem">
            🎯 Skor:
            <span id="score">0</span>
        </div>

        <div class="hudItem">
            ⏱️ Süre:
            <span id="time">30</span>
        </div>

        <div class="hudItem">
            🏆 Rekor:
            <span id="best">0</span>
        </div>

    </div>


    <div id="arena"></div>


    <div id="crosshair">
        <div class="crossDot"></div>
    </div>


    <div id="flash"></div>


    <div id="gameOver">

        <div class="gameOverBox">

            <h2>OYUN BİTTİ!</h2>

            <div class="result">
                🎯 Skor:
                <span id="finalScore">0</span>
            </div>

            <div class="result">
                🏆 Rekor:
                <span id="finalBest">0</span>
            </div>

            <button class="restartBtn" onclick="startGame()">
                TEKRAR OYNA
            </button>

        </div>

    </div>

</div>


<script>

/* =========================
   OYUN DEĞİŞKENLERİ
========================= */

let score = 0;
let timeLeft = 30;

let gameRunning = false;

let timerInterval = null;
let targetInterval = null;


/* =========================
   HTML ELEMANLARI
========================= */

const menu =
    document.getElementById("menu");

const game =
    document.getElementById("game");

const arena =
    document.getElementById("arena");

const scoreText =
    document.getElementById("score");

const timeText =
    document.getElementById("time");

const bestText =
    document.getElementById("best");

const gameOver =
    document.getElementById("gameOver");

const finalScore =
    document.getElementById("finalScore");

const finalBest =
    document.getElementById("finalBest");

const crosshair =
    document.getElementById("crosshair");

const flash =
    document.getElementById("flash");


/* =========================
   REKOR
========================= */

let bestScore =
    Number(localStorage.getItem("targetGameBest")) || 0;

bestText.textContent = bestScore;


/* =========================
   NİŞANGÂH
========================= */

document.addEventListener("mousemove", function(e){

    crosshair.style.left =
        e.clientX + "px";

    crosshair.style.top =
        e.clientY + "px";

});


/* =========================
   OYUNU BAŞLAT
========================= */

function startGame(){

    score = 0;
    timeLeft = 30;

    gameRunning = true;

    scoreText.textContent = score;
    timeText.textContent = timeLeft;

    menu.style.display = "none";
    game.style.display = "block";
    gameOver.style.display = "none";

    arena.innerHTML = "";

    clearInterval(timerInterval);
    clearInterval(targetInterval);

    createTarget();

    /*
       Her 900 milisaniyede
       yeni hedef oluşturulur.
    */

    targetInterval =
        setInterval(createTarget,900);


    /*
       Sayaç
    */

    timerInterval =
        setInterval(function(){

            timeLeft--;

            timeText.textContent =
                timeLeft;

            if(timeLeft <= 0){

                endGame();

            }

        },1000);
}


/* =========================
   HEDEF OLUŞTUR
========================= */

function createTarget(){

    if(!gameRunning) return;

    const target =
        document.createElement("div");

    target.className = "target";


    /*
       Arena boyutlarını al
    */

    const arenaWidth =
        arena.clientWidth;

    const arenaHeight =
        arena.clientHeight;


    const targetSize = 75;


    /*
       Rastgele konum
    */

    const x =
        Math.random() *
        (arenaWidth - targetSize);

    const y =
        Math.random() *
        (arenaHeight - targetSize);


    target.style.left =
        x + "px";

    target.style.top =
        y + "px";


    /*
       Hedefe tıklanınca
    */

    target.addEventListener(
        "click",
        hitTarget
    );


    arena.appendChild(target);


    /*
       Çok fazla hedef birikmesini
       engelle
    */

    const targets =
        document.querySelectorAll(".target");

    if(targets.length > 6){

        targets[0].remove();

    }
}


/* =========================
   HEDEF VURULDU
========================= */

function hitTarget(e){

    if(!gameRunning) return;

    e.stopPropagation();


    score++;

    scoreText.textContent =
        score;


    /*
       Vurulan hedefi kaldır
    */

    e.target.remove();


    /*
       Küçük efekt
    */

    showFlash(
        e.clientX,
        e.clientY
    );
}


/* =========================
   ATIŞ EFEKTİ
========================= */

function showFlash(x,y){

    flash.style.left =
        x + "px";

    flash.style.top =
        y + "px";

    flash.style.opacity = "1";

    setTimeout(function(){

        flash.style.opacity = "0";

    },80);
}


/* =========================
   BOŞ YERE TIKLAMA
========================= */

arena.addEventListener("click",function(e){

    if(!gameRunning) return;

    if(e.target === arena){

        /*
           Boş yere tıklanınca
           şimdilik puan gitmez.
        */

        showFlash(
            e.clientX,
            e.clientY
        );
    }

});


/* =========================
   OYUNU BİTİR
========================= */

function endGame(){

    gameRunning = false;

    clearInterval(timerInterval);
    clearInterval(targetInterval);

    arena.innerHTML = "";


    /*
       Rekor kontrolü
    */

    if(score > bestScore){

        bestScore = score;

        localStorage.setItem(
            "targetGameBest",
            bestScore
        );

    }


    bestText.textContent =
        bestScore;

    finalScore.textContent =
        score;

    finalBest.textContent =
        bestScore;

    gameOver.style.display =
        "flex";
}


/* =========================
   KLAVYE
========================= */

document.addEventListener(
    "keydown",
    function(e){

        /*
           ESC ile menüye dönme
        */

        if(e.key === "Escape" && gameRunning){

            endGame();

        }

    }
);

</script>

</body>
</html>
```
