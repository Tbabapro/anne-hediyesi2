<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MiniGame 2.0</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#dff6ff,#f4e1ff);
    color:#222;
}

button,input{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
}

.container{
    width:min(900px,94%);
    margin:auto;
}

.panel{
    background:#ffffffee;
    padding:25px;
    margin:20px 0;
    border-radius:22px;
    box-shadow:0 8px 25px #0002;
}

.hidden{
    display:none!important;
}

button{
    padding:12px 18px;
    border-radius:12px;
    font-weight:bold;
    margin:5px;
}

.btn{
    background:#675cff;
    color:white;
}

.reset{
    background:#ff4757;
    color:white;
}

.back{
    background:#ddd;
    color:#222;
}

input{
    width:min(350px,90%);
    padding:13px;
    border:2px solid #ddd;
    border-radius:10px;
    margin:5px;
    outline:none;
}

input:focus{
    border-color:#675cff;
}

.game{
    background:white;
    padding:20px;
    border-radius:18px;
    margin:15px 0;
}

#snakeCanvas{
    display:block;
    margin:15px auto;
    border:4px solid #222;
    background:#eee;
    max-width:100%;
}

.stats{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
}

.message{
    min-height:25px;
    font-weight:bold;
}

</style>
</head>

<body>

<!-- =========================
     GİRİŞ
========================= -->

<div id="login" class="panel container">

    <h1>🎮 MiniGame 2.0</h1>

    <p>
        Oyuncu adını ve şifreni gir.
    </p>

    <input
        id="name"
        maxlength="20"
        placeholder="Oyuncu adı">

    <br>

    <input
        id="password"
        type="password"
        maxlength="40"
        placeholder="Şifre">

    <br>

    <button
        class="btn"
        onclick="login()">
        🎮 Oyuna Gir
    </button>

    <p id="loginMsg" class="message"></p>

</div>


<!-- =========================
     ANA SAYFA
========================= -->

<div id="main" class="hidden">

<div class="container">

    <!-- PROFİL -->

    <div class="panel">

        <h1>🎮 MiniGame 2.0</h1>

        <h2>
            👤 <span id="playerName">Oyuncu</span>
        </h2>

        <h2>
            💰 <span id="coins">0</span> puan
        </h2>

        <!-- SADECE EKLENEN TUŞ -->

        <button
            class="reset"
            onclick="resetAccountData()">
            🔄 Verileri Sıfırla
        </button>

        <button
            class="back"
            onclick="logout()">
            🚪 Çıkış
        </button>

    </div>


    <!-- OYUNLAR -->

    <div class="panel">

        <h2>🎮 Oyunlar</h2>

        <div class="game">

            <h3>🐍 Yılan</h3>

            <div class="stats">

                <b>
                    🐍 Puan:
                    <span id="snakeScore">0</span>
                </b>

                <b>
                    💰 Toplam:
                    <span id="gameCoins">0</span>
                </b>

            </div>

            <canvas
                id="snakeCanvas"
                width="400"
                height="400">
            </canvas>

            <button
                class="btn"
                onclick="startSnake()">
                🐍 Başlat
            </button>

            <p
                id="snakeMsg"
                class="message">
            </p>

        </div>

    </div>


    <!-- REKORLAR -->

    <div class="panel">

        <h2>🏆 Rekorlar</h2>

        <p>
            🐍 Yılan Rekoru:
            <b id="snakeBest">0</b>
        </p>

        <p>
            ⭐ Toplam Rekor:
            <b id="bestScore">0</b>
        </p>

    </div>

</div>

</div>


<script>

/* =====================================================
   HESAP SİSTEMİ
===================================================== */

let account = {
    name:"",
    password:"",
    coins:0
};


/* =====================================================
   YILAN DEĞİŞKENLERİ
===================================================== */

let snake = [];
let food = {};

let direction = "right";
let nextDirection = "right";

let snakeScore = 0;

let snakeTimer = null;
let snakeRunning = false;


/* =====================================================
   HESABI KAYDET
===================================================== */

function saveAccount(){

    localStorage.setItem(
        "miniGameAccount",
        JSON.stringify(account)
    );

}


/* =====================================================
   GİRİŞ
===================================================== */

function login(){

    const name =
        document
        .getElementById("name")
        .value
        .trim();

    const password =
        document
        .getElementById("password")
        .value;

    const msg =
        document.getElementById("loginMsg");

    const saved =
        localStorage.getItem("miniGameAccount");


    if(!saved){

        if(name.length < 2){

            msg.textContent =
                "❌ İsim en az 2 karakter olmalı.";

            return;
        }

        if(password.length < 4){

            msg.textContent =
                "❌ Şifre en az 4 karakter olmalı.";

            return;
        }


        account = {

            name:name,
            password:password,
            coins:0

        };


        saveAccount();

        enterGame();

        return;
    }


    try{

        account =
            JSON.parse(saved);

    }catch(error){

        msg.textContent =
            "❌ Hesap verisi bozulmuş.";

        return;
    }


    if(name !== account.name){

        msg.textContent =
            "❌ Oyuncu adı yanlış.";

        return;
    }


    if(password !== account.password){

        msg.textContent =
            "❌ Şifre yanlış.";

        return;
    }


    enterGame();

}


/* =====================================================
   OYUNA GİR
===================================================== */

function enterGame(){

    document
        .getElementById("login")
        .classList.add("hidden");

    document
        .getElementById("main")
        .classList.remove("hidden");

    updatePage();

}


/* =====================================================
   ÇIKIŞ
===================================================== */

function logout(){

    stopSnake();

    document
        .getElementById("main")
        .classList.add("hidden");

    document
        .getElementById("login")
        .classList.remove("hidden");

    document
        .getElementById("password")
        .value = "";

    document
        .getElementById("loginMsg")
        .textContent = "";

}


/* =====================================================
   SAYFAYI GÜNCELLE
===================================================== */

function updatePage(){

    const coins =
        Number(account.coins || 0);


    document
        .getElementById("playerName")
        .textContent =
        account.name;


    document
        .getElementById("coins")
        .textContent =
        coins;


    document
        .getElementById("gameCoins")
        .textContent =
        coins;


    document
        .getElementById("snakeBest")
        .textContent =
        localStorage.getItem("snakeBest") || 0;


    document
        .getElementById("bestScore")
        .textContent =
        localStorage.getItem("bestScore") || 0;

}


/* =====================================================
   PUAN EKLE
===================================================== */

function addCoins(amount){

    amount =
        Number(amount);


    if(!Number.isFinite(amount)){
        return;
    }


    amount =
        Math.max(0,amount);


    account.coins =
        Number(account.coins || 0)
        + amount;


    saveAccount();

    updatePage();

}


/* =====================================================
   🔄 HESABI SIFIRLA
   İSİM VE ŞİFRE KALIR
===================================================== */

function resetAccountData(){

    const answer =
        confirm(

            "⚠️ EMİN MİSİN?\n\n" +

            "Puanların ve oyun rekorların " +
            "sıfırlanacak.\n\n" +

            "İsmin ve şifren KORUNACAK.\n\n" +

            "Devam etmek istiyor musun?"

        );


    if(!answer){

        return;

    }


    const oldName =
        account.name;

    const oldPassword =
        account.password;


    account = {

        name:oldName,

        password:oldPassword,

        coins:0

    };


    localStorage.removeItem(
        "snakeBest"
    );

    localStorage.removeItem(
        "bestScore"
    );


    saveAccount();

    stopSnake();

    updatePage();


    document
        .getElementById("snakeScore")
        .textContent = "0";


    document
        .getElementById("snakeMsg")
        .textContent = "";


    alert(

        "✅ Veriler sıfırlandı!\n\n" +

        "İsmin ve şifren korundu."

    );

}


/* =====================================================
   YILAN
===================================================== */

const canvas =
    document.getElementById(
        "snakeCanvas"
    );

const ctx =
    canvas.getContext("2d");


/* =====================================================
   YILANI BAŞLAT
===================================================== */

function startSnake(){

    stopSnake();


    snake = [

        {
            x:200,
            y:200
        },

        {
            x:180,
            y:200
        },

        {
            x:160,
            y:200
        }

    ];


    direction =
        "right";

    nextDirection =
        "right";

    snakeScore =
        0;

    snakeRunning =
        true;


    document
        .getElementById("snakeScore")
        .textContent =
        "0";


    document
        .getElementById("snakeMsg")
        .textContent =
        "🐍 Başladın!";


    createFood();

    drawSnake();


    snakeTimer =
        setInterval(
            snakeLoop,
            250
        );

}


/* =====================================================
   YILANI DURDUR
===================================================== */

function stopSnake(){

    if(snakeTimer){

        clearInterval(
            snakeTimer
        );

        snakeTimer = null;

    }


    snakeRunning =
        false;

}


/* =====================================================
   YEMEK OLUŞTUR
===================================================== */

function createFood(){

    food = {

        x:
            Math.floor(
                Math.random() * 20
            ) * 20,

        y:
            Math.floor(
                Math.random() * 20
            ) * 20

    };


    const onSnake =
        snake.some(
            function(part){

                return (

                    part.x === food.x &&

                    part.y === food.y

                );

            }
        );


    if(onSnake){

        createFood();

    }

}


/* =====================================================
   YILAN DÖNGÜSÜ
===================================================== */

function snakeLoop(){

    if(!snakeRunning){

        return;

    }


    direction =
        nextDirection;


    const head = {

        x:snake[0].x,

        y:snake[0].y

    };


    if(direction === "up"){

        head.y -= 20;

    }


    if(direction === "down"){

        head.y += 20;

    }


    if(direction === "left"){

        head.x -= 20;

    }


    if(direction === "right"){

        head.x += 20;

    }


    if(

        head.x < 0 ||

        head.x >= 400 ||

        head.y < 0 ||

        head.y >= 400

    ){

        finishSnake();

        return;

    }


    const hitSelf =
        snake.some(
            function(part){

                return (

                    part.x === head.x &&

                    part.y === head.y

                );

            }
        );


    if(hitSelf){

        finishSnake();

        return;

    }


    snake.unshift(head);


    if(

        head.x === food.x &&

        head.y === food.y

    ){

        snakeScore++;


        document
            .getElementById(
                "snakeScore"
            )
            .textContent =
            snakeScore;


        createFood();

    }

    else{

        snake.pop();

    }


    drawSnake();

}


/* =====================================================
   YILANI ÇİZ
===================================================== */

function drawSnake(){

    ctx.clearRect(
        0,
        0,
        400,
        400
    );


    ctx.fillStyle =
        "#2ed573";


    snake.forEach(
        function(part){

            ctx.fillRect(

                part.x + 1,

                part.y + 1,

                18,

                18

            );

        }
    );


    ctx.fillStyle =
        "#ff4757";


    ctx.beginPath();


    ctx.arc(

        food.x + 10,

        food.y + 10,

        8,

        0,

        Math.PI * 2

    );


    ctx.fill();

}


/* =====================================================
   OYUN BİTTİ
===================================================== */

function finishSnake(){

    stopSnake();


    const reward =
        snakeScore * 80;


    addCoins(
        reward
    );


    const oldBest =
        Number(
            localStorage.getItem(
                "snakeBest"
            ) || 0
        );


    if(snakeScore > oldBest){

        localStorage.setItem(
            "snakeBest",
            snakeScore
        );

    }


    const oldTotalBest =
        Number(
            localStorage.getItem(
                "bestScore"
            ) || 0
        );


    if(

        Number(account.coins) >
        oldTotalBest

    ){

        localStorage.setItem(
            "bestScore",
            account.coins
        );

    }


    updatePage();


    document
        .getElementById(
            "snakeMsg"
        )
        .textContent =
        "🏁 Oyun bitti! +" +
        reward +
        " puan!";


    alert(

        "🐍 Oyun bitti!\n\n" +

        snakeScore +
        " elma topladın!\n\n" +

        "+" +
        reward +
        " puan kazandın!"

    );

}


/* =====================================================
   KLAVYE
===================================================== */

document.addEventListener(

    "keydown",

    function(event){

        const keys = {

            ArrowUp:"up",
            ArrowDown:"down",
            ArrowLeft:"left",
            ArrowRight:"right",

            w:"up",
            W:"up",

            s:"down",
            S:"down",

            a:"left",
            A:"left",

            d:"right",
            D:"right"

        };


        const newDirection =
            keys[event.key];


        if(!newDirection){

            return;

        }


        event.preventDefault();


        const opposite = {

            up:"down",
            down:"up",
            left:"right",
            right:"left"

        };


        if(

            opposite[newDirection] !==
            direction

        ){

            nextDirection =
                newDirection;

        }

    }

);

</script>

    

</body>
</html>
